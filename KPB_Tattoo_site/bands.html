<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<title>The Bands · Kimberley Pipe Band 100th Anniversary Tattoo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<link rel="stylesheet" href="docs/site.css">
<style>
.pg-head{padding-top:clamp(40px,6vw,80px);padding-bottom:clamp(8px,2vw,20px)}
.pg-head h1{font-size:clamp(46px,7.4vw,92px);line-height:.92;letter-spacing:.005em}
.pg-head .copy{margin-top:18px}
.back-row{margin-top:clamp(36px,6vw,60px)}
/* host feature */
.feature{padding-top:clamp(24px,4vw,40px)}
.f-hero{position:relative;margin:0;border:1px solid var(--line);background:#000}
.f-hero img{display:block;width:100%;height:auto}
.f-hero figcaption{position:absolute;left:0;right:0;bottom:0;padding:44px clamp(16px,3vw,28px) 14px;font-size:17px;font-style:italic;color:#fff;background:linear-gradient(to top,rgba(4,6,12,.88),transparent)}
.f-tart{height:8px;background:repeating-linear-gradient(90deg,var(--scarlet) 0 14px,var(--navy) 14px 20px,var(--brass) 20px 24px,var(--navy) 24px 30px)}
.f-title{margin-top:clamp(22px,3.5vw,36px);display:grid;gap:10px}
.f-chip{justify-self:start;font:800 13px/1 var(--display);letter-spacing:.24em;text-transform:uppercase;color:#ffd9dc;border:1px solid rgba(239,85,96,.7);background:rgba(200,32,45,.2);padding:8px 12px}
.f-title h2{font-size:clamp(44px,7vw,84px);line-height:.92}
.f-title .where{color:var(--mute);font-size:19px;font-style:italic}
.f-cols{margin-top:clamp(22px,3.5vw,34px);display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(28px,5vw,60px);align-items:start}
.f-story{display:grid;gap:16px}
.f-story p{font-size:clamp(19px,2.2vw,21px);line-height:1.65}
.f-story p:first-child::first-letter{font:800 3.6em/.8 var(--display);float:left;margin:.06em .1em 0 0;color:var(--scarlet-hi)}
.f-aside{display:grid;gap:26px}
.glance{display:grid;border:1px solid var(--line);background:var(--night)}
.glance div{padding:13px 16px;border-top:1px solid var(--line);display:grid;gap:4px}
.glance div:first-child{border-top:0}
.glance b,.f-h{font:800 13px/1 var(--display);letter-spacing:.24em;text-transform:uppercase;color:var(--brass)}
.glance span{font-size:18px;line-height:1.25}
.f-h{margin:0 0 16px}
.tl{list-style:none;margin:0;padding:0 0 0 22px;border-left:2px solid rgba(212,178,110,.4);display:grid;gap:16px}
.tl li{position:relative;display:grid;gap:3px}
.tl li::before{content:"";position:absolute;left:-29px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--scarlet);border:2px solid var(--navy);box-shadow:0 0 0 1px var(--brass)}
.tl b{font:800 24px/1.1 var(--display);letter-spacing:.04em;color:var(--brass)}
.tl span{font-size:18px;line-height:1.4}
.f-row{margin-top:clamp(28px,4.5vw,50px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(22px,4vw,44px);align-items:center}
.then{margin:0;display:grid;gap:8px}
.then img{display:block;width:100%;height:auto;border:1px solid var(--line);filter:sepia(.15)}
.then figcaption{font-size:16px;font-style:italic;color:var(--mute)}
.dyk{border-left:4px solid var(--scarlet);background:rgba(200,32,45,.12);padding:20px 24px;display:grid;gap:10px}
.dyk b{font:800 13px/1 var(--display);letter-spacing:.24em;text-transform:uppercase;color:var(--scarlet-hi)}
.dyk p{font-size:20px;line-height:1.5}
/* visiting bands */
.visit{padding-top:clamp(36px,6vw,64px)}
.v-head{display:flex;align-items:center;gap:18px;margin-bottom:clamp(8px,2vw,18px)}
.v-head h2{font-size:clamp(34px,5vw,56px);line-height:.95;white-space:nowrap}
.v-head::after{content:"";flex:1;height:8px;background:repeating-linear-gradient(90deg,var(--scarlet) 0 14px,var(--navy) 14px 20px,var(--brass) 20px 24px,var(--navy) 24px 30px);min-width:40px}
.v-sub{color:var(--mute);font-style:italic;font-size:19px;margin-bottom:clamp(14px,3vw,26px)}
.prog{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(30px,5vw,64px)}
.entry{position:relative;padding:26px 0 30px;border-top:1px solid rgba(212,178,110,.4);display:grid;gap:10px;align-content:start;scroll-margin-top:90px}
.e-top{display:flex;align-items:baseline;gap:12px;font:800 14px/1 var(--display);letter-spacing:.22em;text-transform:uppercase;color:var(--brass)}
.e-top .no{color:var(--mute)}
.e-yr{position:absolute;top:18px;right:0;font:800 58px/1 var(--display);letter-spacing:.02em;color:var(--brass);opacity:.95;pointer-events:none}
.entry h3{font-size:clamp(28px,3.4vw,38px);line-height:.98;max-width:78%}
.e-where{color:var(--mute);font-style:italic;font-size:18px}
.e-where em{font-style:normal;color:var(--brass)}
.e-photo{margin:4px 0 2px;display:grid;gap:5px}
.e-photo img{display:block;width:100%;height:auto;border:1px solid var(--line)}
.e-photo figcaption{font-size:15px;color:var(--mute);font-style:italic}
.entry p.bio{font-size:19px;line-height:1.55;margin-top:4px}
.e-note{font-size:17px;line-height:1.45;color:var(--ivory);border-left:3px solid var(--scarlet);padding:2px 0 2px 14px;margin-top:2px}
.e-note b{font:800 12px/1 var(--display);letter-spacing:.22em;text-transform:uppercase;color:var(--scarlet-hi);display:block;margin-bottom:5px}
.e-links{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:2px}
.e-links a{font:800 13px/1.2 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--brass);text-decoration:none;border-bottom:1px solid rgba(212,178,110,.5);padding-bottom:3px}
.e-links a:hover{color:var(--ivory);border-color:var(--ivory)}
@media(max-width:860px){.f-cols,.f-row{grid-template-columns:1fr}.prog{grid-template-columns:1fr}.entry h3{max-width:70%}}
@media(max-width:560px){.e-yr{font-size:40px;top:22px}.entry{padding:22px 0 26px}.entry p.bio{font-size:18px}.f-hero figcaption{font-size:15px;padding-top:30px}.v-head h2{white-space:normal}}
</style>
</head>
<body>
<div class="top-gap" aria-hidden="true"></div>
<header class="top">
  <div class="in hb">
    <a class="hbtn hb-meet" href="index.html">← Main page</a>
    <a class="hbtn hb-vol" href="https://volunteersignup.org/L8AP3" target="_blank" rel="noopener">Become a volunteer</a>
    <a class="hbtn hb-tix" href="https://cranbrookbucks.goigniter.com/events/45360-kimberley-pipe-band-100th-anniversary-tattoo" target="_blank" rel="noopener">Get tickets</a>
  </div>
</header>

<main>
<div class="tartan" aria-hidden="true"></div>
<section class="band pg-head" aria-labelledby="bands-h">
  <div class="in">
    <div class="eyebrow">The bands</div>
    <h1 id="bands-h">Check out the bands.</h1>
  </div>
</section>
<section class="band feature" aria-labelledby="host-h"><div class="in" id="feature"></div></section>
<section class="band visit" aria-labelledby="visit-h"><div class="in">
  <div class="v-head"><h2 id="visit-h">The visiting bands</h2></div>
  <ol class="prog" id="prog"></ol>
  <noscript><p class="copy">Please turn on JavaScript to read about the bands.</p></noscript>
  <div class="back-row"><a class="btn ghost" href="index.html">← Back to the main page</a></div>
</div></section>
</main>
<div class="tartan" aria-hidden="true"></div>
<footer><div class="in"><div class="fcol"><b>Kimberley Pipe Band · 1927–2027</b><span>The 100th Anniversary Tattoo · Western Financial Place, Cranbrook</span></div><div class="flinks"><a href="mailto:Info@kimberleypipeband.ca">Info@kimberleypipeband.ca</a><a href="https://www.facebook.com/1397696916910297" target="_blank" rel="noopener">Facebook ↗</a></div></div></footer>

<div class="sticky-buy"><a class="btn gold" href="https://cranbrookbucks.goigniter.com/events/45360-kimberley-pipe-band-100th-anniversary-tattoo" target="_blank" rel="noopener">Get tickets</a></div>



<script src="docs/bands.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  var h=window.HOST,list=window.BANDS||[];
  var F=$('feature');
  if(h){
    if(h.hero){var hf=el('figure','f-hero');var im=new Image();im.src=h.hero.src;im.alt=h.hero.cap||h.name;hf.appendChild(im);if(h.hero.cap)hf.appendChild(el('figcaption',null,h.hero.cap));F.appendChild(hf);F.appendChild(el('div','f-tart'))}
    var t=el('div','f-title');t.appendChild(el('span','f-chip','Host band · '+h.est));
    var h2=el('h2',null,h.name);h2.id='host-h';t.appendChild(h2);t.appendChild(el('p','where',h.where));F.appendChild(t);
    var cols=el('div','f-cols'),st=el('div','f-story');
    h.story.forEach(function(x){st.appendChild(el('p',null,x))});cols.appendChild(st);
    var as=el('aside','f-aside');
    if(h.facts){var g=el('div','glance');h.facts.forEach(function(p){var d=el('div');d.appendChild(el('b',null,p[0]));d.appendChild(el('span',null,p[1]));g.appendChild(d)});as.appendChild(g)}
    if(h.timeline){var w=el('div');w.appendChild(el('h3','f-h','Through the years'));var ol=el('ol','tl');h.timeline.forEach(function(p){var li=el('li');li.appendChild(el('b',null,p[0]));li.appendChild(el('span',null,p[1]));ol.appendChild(li)});w.appendChild(ol);as.appendChild(w)}
    cols.appendChild(as);F.appendChild(cols);
    if(h.then||h.dyk){
      var row=el('div','f-row');
      if(h.then){var fg=el('figure','then');var i2=new Image();i2.loading='lazy';i2.src=h.then.src;i2.alt=h.then.cap||'';fg.appendChild(i2);if(h.then.cap)fg.appendChild(el('figcaption',null,h.then.cap));row.appendChild(fg)}
      if(h.dyk){var d=el('aside','dyk');d.appendChild(el('b',null,'Did you know?'));d.appendChild(el('p',null,h.dyk));row.appendChild(d)}
      F.appendChild(row);
    }
  }
  var P=$('prog');
  list.forEach(function(b,i){
    var li=el('li','entry');li.id=b.id;
    if(b.yr)li.appendChild(el('span','e-yr'+(b.yr.length>4?' long':''),b.yr)).setAttribute('aria-hidden','true');
    var top=el('div','e-top');top.appendChild(el('span','no',('0'+(i+2)).slice(-2)));top.appendChild(el('span',null,b.est));li.appendChild(top);
    li.appendChild(el('h3',null,b.name));
    var w=el('p','e-where',b.where);if(b.kind){w.appendChild(document.createTextNode(' · '));w.appendChild(el('em',null,b.kind))}li.appendChild(w);
    if(b.img){var fg=el('figure','e-photo'),im=new Image();im.loading='lazy';im.src=b.img;im.alt=b.name;fg.appendChild(im);if(b.credit)fg.appendChild(el('figcaption',null,b.credit));li.appendChild(fg)}
    li.appendChild(el('p','bio',b.bio));
    if(b.note){var n=el('p','e-note');n.appendChild(el('b',null,'Of note'));n.appendChild(document.createTextNode(b.note));li.appendChild(n)}
    if(b.links){var l=el('div','e-links');b.links.forEach(function(p){var a=el('a',null,p[0]+' ↗');a.href=p[1];a.target='_blank';a.rel='noopener';l.appendChild(a)});li.appendChild(l)}
    P.appendChild(li);
  });
  try{if('scrollRestoration' in history)history.scrollRestoration='manual';if(!location.hash)window.scrollTo(0,0)}catch(e){}
})();
</script>
</body>
</html>
